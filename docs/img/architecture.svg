<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-labelledby="t d">
  <title id="t">Resume-Handler architecture</title>
  <desc id="d">The browser page talks to a local server over HTTP and server-sent events. The server runs the core pipeline, which calls an LLM, Google Drive and writes a CSV. The server also posts candidates to an ingestion API, provided by the mock CRM in the demo. The CLI calls the core pipeline directly.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0a6fc2"/></marker>
    <style>
      .sans{font-family:'Inter Tight',Inter,'Segoe UI',Helvetica,Arial,sans-serif}
      .mono{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace}
      .card{fill:#fff;stroke:#e3e6ea;stroke-width:1}
      .key{fill:#fff;stroke:#0a6fc2;stroke-width:1.5}
      .h{font-size:14px;font-weight:600;fill:#111827}
      .s{font-size:12px;fill:#5b6470}
      .m{font-size:12px;fill:#111827}
      .tag{fill:#e3f1fd}
      .tt{font-size:11px;fill:#0b4f8a}
      .ln{stroke:#0a6fc2;stroke-width:1.5;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="880" height="400" rx="12" fill="#ffffff"/>

  <!-- Browser -->
  <rect class="card" x="20" y="130" width="140" height="70" rx="10"/>
  <text class="sans h" x="36" y="156">Browser page</text>
  <text class="sans s" x="36" y="176">React, Vite</text>
  <text class="sans s" x="36" y="191">packages/web</text>

  <!-- Server -->
  <rect class="key" x="220" y="100" width="190" height="130" rx="10"/>
  <text class="sans h" x="236" y="126">Local server</text>
  <text class="mono s" x="236" y="144">packages/server</text>
  <text class="sans s" x="236" y="164">auth: none / token / signed</text>
  <text class="sans s" x="236" y="181">settings + secret vault</text>
  <rect class="tag" x="236" y="195" width="112" height="22" rx="11"/>
  <text class="mono tt" x="246" y="210">127.0.0.1:47831</text>

  <!-- Core -->
  <rect class="key" x="470" y="125" width="150" height="80" rx="10"/>
  <text class="sans h" x="486" y="151">Core pipeline</text>
  <text class="mono s" x="486" y="169">packages/core</text>
  <text class="sans s" x="486" y="186">unzip, parse, extract</text>

  <!-- Targets -->
  <rect class="card" x="700" y="30" width="160" height="56" rx="10"/>
  <text class="sans h" x="716" y="54">LLM</text>
  <text class="sans s" x="716" y="72">OpenRouter or fake</text>
  <rect class="card" x="700" y="110" width="160" height="56" rx="10"/>
  <text class="sans h" x="716" y="134">Google Drive</text>
  <text class="sans s" x="716" y="152">optional, or in-memory</text>
  <rect class="card" x="700" y="190" width="160" height="56" rx="10"/>
  <text class="sans h" x="716" y="214">CSV file</text>
  <text class="sans s" x="716" y="232">local output</text>

  <!-- CRM -->
  <rect class="card" x="700" y="310" width="160" height="56" rx="10"/>
  <text class="sans h" x="716" y="334">Ingestion API</text>
  <text class="sans s" x="716" y="352">mock-crm :47900</text>

  <!-- CLI -->
  <rect class="card" x="470" y="20" width="150" height="50" rx="10"/>
  <text class="sans h" x="486" y="42">CLI</text>
  <text class="mono s" x="486" y="59">packages/cli</text>

  <!-- Arrows -->
  <path class="ln" d="M160 165 H220"/>
  <rect class="tag" x="162" y="130" width="56" height="20" rx="10"/>
  <text class="mono tt" x="171" y="144">SSE</text>
  <path class="ln" d="M410 165 H470"/>
  <path class="ln" d="M620 150 H660 V58 H700"/>
  <path class="ln" d="M620 165 H660 V138 H700"/>
  <path class="ln" d="M620 180 H660 V218 H700"/>
  <path class="ln" d="M545 70 V125"/>
  <text class="sans s" x="555" y="102">in process</text>
  <path class="ln" d="M315 230 V338 H700"/>
  <text class="mono s" x="330" y="328">POST /api/ingestion/preflight, /batch</text>
  <rect class="tag" x="330" y="346" width="150" height="20" rx="10"/>
  <text class="mono tt" x="340" y="360">idempotency key</text>
</svg>
