<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 432" width="880" height="432" role="img" aria-labelledby="t d">
  <title id="t">Resume-Handler architecture</title>
  <desc id="d">The browser page talks to a local server over HTTP and server-sent events. The server runs the core pipeline, which calls an LLM, Google Drive and writes a CSV. The server also posts candidates to an ingestion API, provided by the mock CRM in the demo. The CLI calls the core pipeline directly.</desc>
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#161c23"/>
    </pattern>
    <marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5.5" markerHeight="5.5" markerUnits="strokeWidth" orient="auto-start-reverse">
      <path d="M0 0.5 L10 5 L0 9.5 z" fill="#00b3f2"/>
    </marker>
    <style>
      .sans{font-family:'Inter Tight',Inter,'Segoe UI',Helvetica,Arial,sans-serif}
      .mono{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace}
      .cap{font-size:10.5px;font-weight:600;letter-spacing:.16em;fill:#9ba6b1}
      .h{font-size:14px;font-weight:600;fill:#eceff2}
      .h2{font-size:13px;font-weight:600;fill:#eceff2}
      .s{font-size:12px;fill:#9ba6b1}
      .ms{font-size:12px;fill:#9ba6b1}
      .lab{font-size:11px;fill:#9ba6b1}
      .pt{font-size:11px;fill:#8ddafc}
      .bt{font-size:10.5px;font-weight:600;fill:#8ddafc}
      .ar{stroke:#00b3f2;stroke-width:1.5;fill:none;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#ah)}
    </style>
  </defs>
  <rect width="880" height="432" rx="14" fill="#0a0f14"/>
  <rect width="880" height="432" rx="14" fill="url(#dots)"/>
  <text class="sans cap" x="24" y="32">ARCHITECTURE</text>
  <rect x="24" y="165" width="128" height="88" rx="10" fill="#05080b"/>
  <rect x="24.5" y="164.5" width="127" height="87" rx="10" fill="#12181e" stroke="#272d34"/>
  <text class="sans h" x="40" y="190">Browser page</text>
  <text class="sans s" x="40" y="210">React, Vite</text>
  <text class="mono ms" x="40" y="228">packages/web</text>
  <rect x="200" y="141" width="208" height="136" rx="10" fill="#05080b"/>
  <rect x="200" y="140" width="208" height="136" rx="10" fill="#12181e" stroke="#00b3f2" stroke-width="1.5"/>
  <rect x="204" y="154" width="3" height="108" rx="1.5" fill="#00b3f2"/>
  <text class="sans h" x="216" y="166">Local server</text>
  <text class="mono ms" x="216" y="185">packages/server</text>
  <text class="sans s" x="216" y="206">auth: none / token / signed</text>
  <text class="sans s" x="216" y="224">settings + secret vault</text>
  <rect x="216" y="238" width="115" height="22" rx="11.0" fill="#003044"/>
  <text class="mono pt" x="273.5" y="252.8" text-anchor="middle" style="fill:#8ddafc">127.0.0.1:47831</text>
  <rect x="456" y="161" width="176" height="96" rx="10" fill="#05080b"/>
  <rect x="456" y="160" width="176" height="96" rx="10" fill="#12181e" stroke="#00b3f2" stroke-width="1.5"/>
  <rect x="460" y="174" width="3" height="68" rx="1.5" fill="#00b3f2"/>
  <text class="sans h" x="472" y="188">Core pipeline</text>
  <text class="mono ms" x="472" y="208">packages/core</text>
  <text class="sans s" x="472" y="230">unzip, parse, extract</text>
  <rect x="456" y="57" width="176" height="56" rx="10" fill="#05080b"/>
  <rect x="456.5" y="56.5" width="175" height="55" rx="10" fill="#12181e" stroke="#272d34"/>
  <text class="sans h" x="472" y="80">CLI</text>
  <text class="mono ms" x="472" y="99">packages/cli</text>
  <rect x="680" y="97" width="176" height="64" rx="10" fill="#05080b"/>
  <rect x="680.5" y="96.5" width="175" height="63" rx="10" fill="#12181e" stroke="#272d34"/>
  <text class="sans h" x="696" y="122">LLM</text>
  <text class="sans s" x="696" y="142">OpenRouter or fake</text>
  <rect x="680" y="177" width="176" height="64" rx="10" fill="#05080b"/>
  <rect x="680.5" y="176.5" width="175" height="63" rx="10" fill="#12181e" stroke="#272d34"/>
  <text class="sans h" x="696" y="202">Google Drive</text>
  <text class="sans s" x="696" y="222">optional, or in-memory</text>
  <rect x="680" y="257" width="176" height="64" rx="10" fill="#05080b"/>
  <rect x="680.5" y="256.5" width="175" height="63" rx="10" fill="#12181e" stroke="#272d34"/>
  <text class="sans h" x="696" y="282">CSV file</text>
  <text class="sans s" x="696" y="302">local output</text>
  <rect x="680" y="337" width="176" height="64" rx="10" fill="#05080b"/>
  <rect x="680.5" y="336.5" width="175" height="63" rx="10" fill="#12181e" stroke="#272d34" stroke-dasharray="4 3"/>
  <text class="sans h" x="696" y="362">Ingestion API</text>
  <text class="mono ms" x="696" y="382">mock-crm :47900</text>
  <path class="ar" d="M152 196 H199"/>
  <text class="mono lab" x="176" y="188" text-anchor="middle">HTTP</text>
  <path class="ar" d="M200 220 H153"/>
  <text class="mono lab" x="176" y="238" text-anchor="middle">SSE</text>
  <path class="ar" d="M408 208 H455"/>
  <path class="ar" d="M544 112 V159"/>
  <text class="sans s" x="556" y="140">in process</text>
  <path class="ar" d="M632 184 H648 Q656 184 656 176 V136 Q656 128 664 128 H679"/>
  <path class="ar" d="M632 208 H679"/>
  <path class="ar" d="M632 232 H648 Q656 232 656 240 V280 Q656 288 664 288 H679"/>
  <path class="ar" d="M304 276 V360 Q304 368 312 368 H679"/>
  <text class="mono ms" x="320" y="358">POST /api/ingestion/preflight, /batch</text>
  <rect x="320" y="378" width="115" height="20" rx="10.0" fill="#003044"/>
  <text class="mono pt" x="377.5" y="391.8" text-anchor="middle" style="fill:#8ddafc">idempotency key</text>
</svg>
