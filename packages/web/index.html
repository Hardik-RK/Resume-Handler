<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Résumé Intake</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Runs before first paint so the saved theme never flashes.
      (function () {
        var r = document.documentElement, t = null;
        try { t = localStorage.getItem('intake-theme'); } catch (e) {}
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) r.classList.add('dark');
        if (matchMedia('(prefers-reduced-motion: reduce)').matches) r.classList.add('perf');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
